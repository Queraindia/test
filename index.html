<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>CMG Coaching Workspace</title>

  <!-- Google Material Symbols & Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Firebase Modular SDK v12.16.0 -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js"
      }
    }
  </script>

  <style>
    /* ===== GOOGLE MATERIAL 3 DESIGN TOKENS ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* M3 Light Theme */
      --md-sys-color-primary: #0b57d0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d3e3fd;
      --md-sys-color-on-primary-container: #041e49;
      --md-sys-color-secondary: #444746;
      --md-sys-color-surface: #f3f6fc; /* Google Workspace Background */
      --md-sys-color-surface-container: #ffffff;
      --md-sys-color-surface-container-high: #e8eaed;
      --md-sys-color-on-surface: #1f1f1f;
      --md-sys-color-on-surface-variant: #444746;
      --md-sys-color-outline: #747775;
      --md-sys-color-outline-variant: #c4c7c5;
      --md-sys-color-error: #b3261e;
      --md-sys-color-success: #146c2e;
      
      /* Shapes & Elevations */
      --md-sys-shape-corner-extra-large: 28px;
      --md-sys-shape-corner-large: 16px;
      --md-sys-shape-corner-medium: 12px;
      --md-sys-shape-corner-full: 100px;
      --md-sys-elevation-1: 0 1px 2px 0 rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
      --md-sys-elevation-2: 0 1px 2px 0 rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15);
      --md-sys-elevation-3: 0 1px 3px 0 rgba(0,0,0,0.3), 0 4px 8px 3px rgba(0,0,0,0.15);
      
      /* Transitions */
      --md-transition-standard: 0.25s cubic-bezier(0.2, 0, 0, 1);
      --font-family: 'Inter', 'Google Sans', sans-serif;
      --nav-width: 280px;
      --header-height: 64px;
      --bottom-nav-height: 80px;
    }
    
    [data-theme="dark"] {
      --md-sys-color-primary: #a8c7fa;
      --md-sys-color-on-primary: #062e6f;
      --md-sys-color-primary-container: #0842a0;
      --md-sys-color-on-primary-container: #d3e3fd;
      --md-sys-color-secondary: #c4c7c5;
      --md-sys-color-surface: #131314;
      --md-sys-color-surface-container: #1e1f20;
      --md-sys-color-surface-container-high: #282a2c;
      --md-sys-color-on-surface: #e3e3e3;
      --md-sys-color-on-surface-variant: #c4c7c5;
      --md-sys-color-outline: #8e918f;
      --md-sys-color-outline-variant: #444746;
      --md-sys-color-error: #f2b8b5;
      --md-sys-color-success: #6dd58c;
    }
    
    html, body {
      font-family: var(--font-family);
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      height: 100%; overflow: hidden;
      transition: background var(--md-transition-standard), color var(--md-transition-standard);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--md-sys-color-primary); text-decoration: none; font-weight: 500; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 4px; }

    /* ===== SPLASH ===== */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--md-sys-color-surface);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash-logo {
      width: 110px; height: 110px; border-radius: 32px; object-fit: cover;
      box-shadow: var(--md-sys-elevation-2);
      animation: splashPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes splashPop {
      0% { opacity: 0; transform: scale(0.8) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    #splash h1 {
      margin-top: 24px; font-size: 32px; font-weight: 500;
      color: var(--md-sys-color-on-surface); font-family: 'Google Sans', sans-serif;
    }
    .splash-loader {
      margin-top: 32px; width: 48px; height: 48px;
      border: 4px solid var(--md-sys-color-primary-container);
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* ===== LOGIN ===== */
    #login-page {
      position: fixed; inset: 0; z-index: 100;
      display: none; align-items: center; justify-content: center;
      background: var(--md-sys-color-surface); overflow: hidden;
    }
    #login-page.active { display: flex; }
    
    .login-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .login-bg .book {
      position: absolute; font-size: 40px; opacity: 0.08;
      animation: floatBook 20s infinite linear; color: var(--md-sys-color-primary);
    }
    @keyframes floatBook {
      0% { transform: translate(0,0) rotate(0deg); }
      25% { transform: translate(60px,-40px) rotate(4deg); }
      50% { transform: translate(-20px,-80px) rotate(-2deg); }
      75% { transform: translate(40px,-30px) rotate(6deg); }
      100% { transform: translate(0,0) rotate(0deg); }
    }

    .login-card {
      position: relative; z-index: 2;
      width: 100%; max-width: 440px; padding: 48px 40px;
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-extra-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: var(--md-sys-elevation-2);
      margin: 16px;
    }
    .login-card .logo-wrap { text-align: center; margin-bottom: 32px; }
    .login-card .logo-wrap img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 16px; }
    .login-card .logo-wrap h2 { font-size: 26px; font-family: 'Google Sans', sans-serif; font-weight: 400; }
    .login-card .logo-wrap span { color: var(--md-sys-color-on-surface-variant); font-size: 15px; margin-top: 8px; display: block; }
    
    .md-field { margin-bottom: 24px; position: relative; }
    .md-field label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px;
    }
    .md-field input, .md-field textarea, .md-field select {
      width: 100%; padding: 14px 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium);
      font-size: 15px; font-family: var(--font-family);
      background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface);
      transition: border var(--md-transition-standard), box-shadow var(--md-transition-standard);
      outline: none;
    }
    .md-field input:focus, .md-field textarea:focus, .md-field select:focus {
      border-color: var(--md-sys-color-primary);
      border-width: 2px; padding: 13px 15px; /* Offset border width */
    }
    .error-text { color: var(--md-sys-color-error); font-size: 12px; margin-top: 6px; display: none; }
    .error-text.show { display: block; }

    .btn-primary {
      width: 100%; padding: 14px 24px; border: none;
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
      font-size: 15px; font-weight: 500; font-family: var(--font-family);
      cursor: pointer; transition: all var(--md-transition-standard);
      position: relative; overflow: hidden;
    }
    .btn-primary:hover {
      box-shadow: var(--md-sys-elevation-1);
      background: linear-gradient(0deg, rgba(255,255,255,0.08), rgba(255,255,255,0.08)), var(--md-sys-color-primary);
    }
    .btn-primary:active { transform: scale(0.98); box-shadow: none; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ===== APP SHELL ===== */
    #app { display: none; height: 100vh; overflow: hidden; }
    #app.active { display: flex; }
    
    .nav-drawer {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--nav-width);
      background: var(--md-sys-color-surface);
      overflow-y: auto; z-index: 50;
      transform: translateX(-100%);
      transition: transform var(--md-transition-standard);
      padding: 24px 12px;
      display: flex; flex-direction: column;
    }
    .nav-drawer.open { transform: translateX(0); box-shadow: var(--md-sys-elevation-2); }
    @media (min-width: 768px) {
      .nav-drawer { transform: translateX(0); box-shadow: none; }
    }
    
    /* Brand Header in Drawer */
    .nav-drawer .brand {
      display: flex; align-items: center; justify-content: space-between; 
      padding: 0 8px 24px 16px; margin-bottom: 12px; width: 100%;
    }
    .nav-drawer .brand .brand-info {
      display: flex; align-items: center; gap: 16px;
    }
    .nav-drawer .brand img { width: 48px; height: 48px; border-radius: 12px; }
    .nav-drawer .brand h3 { font-size: 20px; font-family: 'Google Sans', sans-serif; font-weight: 500; }
    
    /* 3 Lines Toggle Button inside Drawer (Visible on Mobile) */
    .drawer-menu-btn {
      display: none; background: none; border: none; font-size: 24px;
      cursor: pointer; color: var(--md-sys-color-on-surface);
      width: 44px; height: 44px; border-radius: 50%;
      align-items: center; justify-content: center;
      transition: background var(--md-transition-standard);
    }
    .drawer-menu-btn:hover { background: var(--md-sys-color-surface-container-high); }
    @media (max-width: 767px) {
      .drawer-menu-btn { display: flex; }
    }

    .nav-item {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 16px; margin-bottom: 4px;
      border-radius: var(--md-sys-shape-corner-full);
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 500; font-size: 14px;
      transition: all var(--md-transition-standard);
    }
    .nav-item:hover { background: var(--md-sys-color-surface-container-high); }
    .nav-item.active {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .nav-item .mat-icon { font-size: 24px; font-variation-settings: 'FILL' 0; transition: font-variation-settings 0.2s; }
    .nav-item.active .mat-icon { font-variation-settings: 'FILL' 1; color: var(--md-sys-color-primary); }
    
    .main-content {
      flex: 1; display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
      background: var(--md-sys-color-surface);
      transition: margin-left var(--md-transition-standard);
    }
    @media (min-width: 768px) {
      .main-content { margin-left: var(--nav-width); background: var(--md-sys-color-surface-container); border-radius: 24px 0 0 24px; margin-top: 12px; height: calc(100vh - 12px); border: 1px solid var(--md-sys-color-outline-variant); }
    }

    .app-header {
      height: var(--header-height); padding: 0 24px;
      display: flex; align-items: center; gap: 16px;
      background: transparent; flex-shrink: 0; margin-top: 8px;
    }
    .app-header .menu-btn {
      background: none; border: none; font-size: 24px;
      cursor: pointer; color: var(--md-sys-color-on-surface);
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--md-transition-standard);
    }
    .app-header .menu-btn:hover { background: var(--md-sys-color-surface-container-high); }
    .app-header .header-title { font-size: 22px; font-family: 'Google Sans', sans-serif; font-weight: 400; flex: 1; }
    .app-header .avatar-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none;
      background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary);
      font-weight: 600; font-size: 16px; cursor: pointer; transition: transform var(--md-transition-standard);
    }
    .app-header .avatar-btn:hover { transform: scale(1.05); }

    .page-content {
      flex: 1; overflow-y: auto; padding: 24px;
    }
    .page-title-banner { margin-bottom: 28px; }
    .page-title-banner h2 { font-size: 32px; font-family: 'Google Sans', sans-serif; font-weight: 400; color: var(--md-sys-color-on-surface); }
    .page-title-banner p { color: var(--md-sys-color-on-surface-variant); font-size: 15px; margin-top: 6px; }

    /* ===== M3 BOTTOM NAV ===== */
    .bottom-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--bottom-nav-height); background: var(--md-sys-color-surface-container);
      z-index: 40; justify-content: space-around; align-items: center;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .bnav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      border: none; background: none; color: var(--md-sys-color-on-surface-variant);
      font-size: 12px; font-weight: 500; cursor: pointer; padding: 8px 12px;
      position: relative; overflow: hidden;
    }
    .bnav-item .icon-wrap {
      width: 64px; height: 32px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .bnav-item.active { color: var(--md-sys-color-on-surface); font-weight: 600; }
    .bnav-item.active .icon-wrap { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .bnav-item.active .mat-icon { font-variation-settings: 'FILL' 1; }

    /* ===== CARDS (Google Material 3) ===== */
    .md-card {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-extra-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 24px; margin-bottom: 16px;
      transition: box-shadow var(--md-transition-standard);
    }
    .md-card:hover { box-shadow: var(--md-sys-elevation-1); }
    .md-card .card-title { font-size: 18px; font-family: 'Google Sans', sans-serif; font-weight: 500; margin-bottom: 8px; }
    .md-card .card-sub { font-size: 14px; color: var(--md-sys-color-on-surface-variant); }
    .md-card .card-meta { font-size: 13px; color: var(--md-sys-color-on-surface-variant); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .md-card .card-actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    
    .chip {
      display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 8px;
      font-size: 12px; font-weight: 600; font-family: 'Google Sans', sans-serif;
      background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface-variant);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .chip.primary { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); border: none; }
    .chip.green { background: #e6f4ea; color: #1e7e34; border:none; }
    .chip.orange { background: #fef7e0; color: #b45b0a; border:none; }
    .chip.blue { background: #e8f0fe; color: #1a5bb5; border:none; }
    [data-theme="dark"] .chip.green { background: #1e3a2a; color: #81c995; }
    [data-theme="dark"] .chip.orange { background: #3a2e1e; color: #fdd663; }
    [data-theme="dark"] .chip.blue { background: #1a2a4a; color: #8ab4f8; }
    
    .btn-sm {
      padding: 8px 20px; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-full);
      font-size: 14px; font-weight: 500; font-family: var(--font-family);
      cursor: pointer; background: transparent; color: var(--md-sys-color-primary);
      transition: background var(--md-transition-standard);
      position: relative; overflow: hidden;
    }
    .btn-sm:hover { background: var(--md-sys-color-primary-container); border-color: transparent; }
    .btn-sm.primary { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border: none; }
    .btn-sm.primary:hover { background: linear-gradient(0deg, rgba(255,255,255,0.08), rgba(255,255,255,0.08)), var(--md-sys-color-primary); }
    .btn-sm.danger { background: var(--md-sys-color-error); color: #fff; border: none; }
    .btn-sm.outline { border: 1px solid var(--md-sys-color-primary); color: var(--md-sys-color-primary); }

    .md-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .md-grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    
    .stat-card { text-align: center; padding: 24px; border: none; background: var(--md-sys-color-primary-container); }
    .stat-card .num { font-size: 40px; font-weight: 400; font-family: 'Google Sans', sans-serif; color: var(--md-sys-color-primary); }
    .stat-card .label { font-size: 14px; font-weight: 500; color: var(--md-sys-color-on-primary-container); margin-top: 4px; }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--md-sys-color-on-surface-variant); }
    .empty-state .mat-icon { font-size: 56px; opacity: 0.5; margin-bottom: 16px; }
    .empty-state h4 { font-size: 20px; font-family: 'Google Sans', sans-serif; font-weight: 500; color: var(--md-sys-color-on-surface); }

    .avatar-circle {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 16px; color: #fff;
      flex-shrink: 0; background: var(--md-sys-color-primary);
    }
    .avatar-circle.small { width: 36px; height: 36px; font-size: 14px; }
    .avatar-circle.large { width: 80px; height: 80px; font-size: 28px; }

    .edu-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary);
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 12px; letter-spacing: 0.5px;
    }

    /* DIALOG (M3) */
    .dialog-overlay {
      position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.45);
      display: none; align-items: center; justify-content: center; padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.2, 0, 0, 1);
    }
    .dialog-overlay.active {
      display: flex; opacity: 1; pointer-events: auto;
    }
    .dialog-box {
      background: var(--md-sys-color-surface-container); border-radius: 28px;
      max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto;
      padding: 32px; box-shadow: var(--md-sys-elevation-3);
      opacity: 0; transform: translateY(16px) scale(0.98);
      transition: opacity 0.28s cubic-bezier(0.2, 0, 0, 1), transform 0.28s cubic-bezier(0.2, 0, 0, 1);
    }
    .dialog-overlay.active .dialog-box {
      opacity: 1; transform: translateY(0) scale(1);
    }
    .dialog-box .dialog-title { font-size: 24px; font-family: 'Google Sans', sans-serif; font-weight: 400; margin-bottom: 8px; }
    .dialog-box .dialog-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 32px; flex-wrap: wrap; }

    /* SNACKBAR */
    .snackbar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      z-index: 300; background: #323232; color: #f1f3f4;
      padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 400;
      box-shadow: var(--md-sys-elevation-3); opacity: 0; transition: all 0.4s cubic-bezier(0.2,0,0,1);
      display: flex; align-items: center; gap: 16px;
    }
    .snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* RIPPLE EFFECT */
    .ripple { position: relative; overflow: hidden; }
    .ripple-effect {
      position: absolute; border-radius: 50%;
      background: rgba(11, 87, 208, 0.15); /* Primary color low opacity */
      transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none;
    }
    [data-theme="dark"] .ripple-effect { background: rgba(168, 199, 250, 0.15); }
    .btn-primary .ripple-effect { background: rgba(255, 255, 255, 0.3); }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    @media (max-width: 767px) {
      .app-header { display: flex; margin-top:0; border-bottom:1px solid var(--md-sys-color-outline-variant); }
      .bottom-nav { display: flex; }
      .main-content { background: var(--md-sys-color-surface); margin-left: 0 !important; }
      .page-content { padding: 16px 16px 100px; }
      .md-card { padding: 20px; border-radius: 20px; }
    }
  </style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <img id="splash-logo" src="https://i.ibb.co/RkfvxS4B/Chat-GPT-Image-Jul-18-2026-11-06-05-PM-1.jpg" alt="CMG Logo" />
  <h1>CMG Coaching</h1>
  <div style="color:var(--md-sys-color-on-surface-variant); font-size:15px; margin-top:8px;">Your Learning Workspace</div>
  <div class="splash-loader"></div>
</div>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-bg" id="loginBg"></div>
  <div class="login-card">
    <div class="logo-wrap">
      <img src="https://i.ibb.co/RkfvxS4B/Chat-GPT-Image-Jul-18-2026-11-06-05-PM-1.jpg" alt="CMG" />

<script type="module">
  import { initializeApp } from 'firebase/app';
  import { getDatabase, ref, set, get, push, update, remove, onValue } from 'firebase/database';

  const firebaseConfig = {
    apiKey: "AIzaSyD16Z5FiJLVJS_I3n_6Vo1r3denFRr9VJw",
    authDomain: "cmgsir-61949.firebaseapp.com",
    databaseURL: "https://cmgsir-61949-default-rtdb.firebaseio.com",
    projectId: "cmgsir-61949",
    storageBucket: "cmgsir-61949.firebasestorage.app"
  };

  let app, db, firebaseConnected = false;
  try {
    app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    firebaseConnected = true;
  } catch (e) { 
    console.warn('Firebase init failed:', e.message); 
  }

  const CLOUD_NAME = 'aly9etwi';
  const UPLOAD_PRESET = 'CMG sir';
  const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

  // --- Core State ---
  let currentUser = null, currentRole = 'student', currentPage = 'dashboard';
  let theme = localStorage.getItem('cmg-theme') || 'system';
  let allUsers = {}, allBatches = {}, allSchedules = {}, allBroadcasts = {}, allDoubts = {}, allAssignments = {}, allSubmissions = {}, allAttendance = {}, allNotifications = {};
  let dataLoaded = false, isDialogOpen = false, needsRefresh = false;
  let firebaseListeners = []; // Array to store unsub functions to prevent duplicate listeners

  // Helper to convert Firebase Object safely into Array containing object keys as `id`
  const toArray = (obj) => {
    if (!obj || typeof obj !== 'object') return [];
    return Object.entries(obj).map(([id, val]) => ({ id, ...(typeof val === 'object' ? val : {}) }));
  };

  const $ = id => document.getElementById(id);

  // --- Theme ---
  function applyTheme(t) {
    const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    localStorage.setItem('cmg-theme', t); theme = t;
  }
  applyTheme(theme);
  $('navThemeToggle')?.addEventListener('click', () => applyTheme(theme === 'light' ? 'dark' : 'light'));

  // --- Ripple Effect ---
  document.addEventListener('click', function(e) {
    const target = e.target.closest('.ripple');
    if (!target) return;
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;
    const ripple = document.createElement('span');
    ripple.className = 'ripple-effect';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = x + 'px'; ripple.style.top = y + 'px';
    target.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });

  // --- Snackbar & Dialogs ---
  let snackTimer;
  function showSnack(msg, duration = 4000) {
    $('snackText').textContent = msg; $('snackbar').classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => $('snackbar').classList.remove('show'), duration);
  }
  $('snackClose').onclick = () => $('snackbar').classList.remove('show');

  function showDialog(title, sub, bodyHTML, actions) {
    return new Promise((resolve) => {
      isDialogOpen = true; needsRefresh = false;
      $('dialogTitle').textContent = title; $('dialogSub').textContent = sub || '';
      $('dialogBody').innerHTML = bodyHTML || ''; $('dialogActions').innerHTML = '';
      if (actions) {
        actions.forEach(a => {
          const btn = document.createElement('button');
          btn.className = `btn-sm ripple ${a.class || ''}`; btn.textContent = a.label;
          btn.onclick = () => { closeDialog(); resolve(a.value); };
          $('dialogActions').appendChild(btn);
        });
      }
      $('dialogOverlay').classList.add('active');
    });
  }
  function closeDialog() {
    $('dialogOverlay').classList.remove('active'); isDialogOpen = false;
    if (needsRefresh) renderPage(currentPage);
  }
  $('dialogOverlay').addEventListener('click', (e) => { if(e.target === $('dialogOverlay')) closeDialog(); });

  // --- Cloudinary ---
  async function uploadToCloudinary(file) {
    const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', UPLOAD_PRESET);
    const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: fd });
    const data = await res.json(); return { url: data.secure_url };
  }
  async function uploadMultiple(files) {
    const results = [];
    for (const f of files) { const r = await uploadToCloudinary(f); results.push(r); }
    return results;
  }

  // --- DB Helpers ---
  function getAvatar(name) {
    if (!name) return '?'; const parts = name.trim().split(' ');
    return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : name[0].toUpperCase();
  }
  function avatarColor(name) {
    const colors = ['#0b57d0', '#e8710a', '#0d7a3e', '#b33b9c', '#d93025', '#1967d2', '#0d652d', '#c5221f'];
    let hash = 0; for (let i = 0; i < name?.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }

  async function dbPush(path, data) { const newRef = push(ref(db, path)); await set(newRef, data); return newRef.key; }
  async function dbUpdate(path, data) { return update(ref(db, path), data); }
  async function dbRemove(path) { return remove(ref(db, path)); }
  async function createRecord(path, data) {
    const id = await dbPush(path, { ...data, createdAt: new Date().toISOString() });
    return { id, ...data };
  }
  async function updateRecord(path, id, data) { await dbUpdate(`${path}/${id}`, data); return true; }
  async function deleteRecord(path, id) { await dbRemove(`${path}/${id}`); return true; }

  // --- Core Data Loader ---
  function loadAllData() {
    if (!firebaseConnected) return;
    
    // Clean up old listeners to prevent duplication
    firebaseListeners.forEach(unsub => { try { unsub(); } catch (e) {} });
    firebaseListeners = [];
    
    const paths = ['users', 'batches', 'schedules', 'broadcasts', 'doubts', 'assignments', 'submissions', 'attendance', 'notifications'];
    
    paths.forEach((p) => {
      const unsub = onValue(ref(db, p), (snap) => {
        const val = snap.val() || {};
        if (p === 'users') allUsers = val;
        else if (p === 'batches') allBatches = val;
        else if (p === 'schedules') allSchedules = val;
        else if (p === 'broadcasts') allBroadcasts = val;
        else if (p === 'doubts') allDoubts = val;
        else if (p === 'assignments') allAssignments = val;
        else if (p === 'submissions') allSubmissions = val;
        else if (p === 'attendance') allAttendance = val;
        else if (p === 'notifications') {
          allNotifications = val;
          if (currentUser) {
             const unread = toArray(val).filter(n => String(n.userId) === String(currentUser.id) && !n.read).length;
             $('notifDot').style.display = unread > 0 ? 'block' : 'none';
          }
        }

        // Keep current user object fresh
        if (p === 'users' && currentUser) {
          const fresh = val[currentUser.id];
          if (fresh) currentUser = { ...currentUser, ...fresh };
        }
        
        // CRITICAL GUARD: Only render if a user is logged in
        if (currentUser && !isDialogOpen && dataLoaded) {
          renderPage(currentPage);
        } else {
          needsRefresh = true;
        }
      });
      firebaseListeners.push(unsub);
    });
    
    dataLoaded = true;
  }

  // --- Routing & Nav ---
  const navConfig = {
    student: [{id:'dashboard',icon:'space_dashboard'}, {id:'schedule',icon:'calendar_month'}, {id:'broadcasts',icon:'campaign'}, {id:'doubts',icon:'forum'}, {id:'assignments',icon:'assignment'}, {id:'attendance',icon:'how_to_reg'}, {id:'profile',icon:'person'}],
    educator: [{id:'dashboard',icon:'space_dashboard'}, {id:'broadcasts',icon:'campaign'}, {id:'doubts',icon:'forum'}, {id:'assignments',icon:'assignment'}, {id:'schedule',icon:'calendar_month'}, {id:'attendance',icon:'how_to_reg'}, {id:'profile',icon:'person'}],
    admin: [{id:'dashboard',icon:'space_dashboard'}, {id:'users',icon:'group'}, {id:'educators',icon:'school'}, {id:'batches',icon:'class'}, {id:'schedule',icon:'calendar_month'}, {id:'broadcasts',icon:'campaign'}, {id:'assignments',icon:'assignment'}, {id:'management',icon:'settings'}, {id:'profile',icon:'person'}]
  };

  function renderNav() {
    const items = navConfig[currentRole] || [];
    $('navItems').innerHTML = ''; $('bottomNav').innerHTML = '';
    items.forEach(it => {
      const label = it.id.charAt(0).toUpperCase() + it.id.slice(1);
      
      const div = document.createElement('div');
      div.className = `nav-item ripple ${currentPage === it.id ? 'active' : ''}`;
      div.innerHTML = `<span class="material-symbols-outlined mat-icon">${it.icon}</span>${label}`;
      div.onclick = () => navigateTo(it.id);
      $('navItems').appendChild(div);

      const bDiv = document.createElement('button');
      bDiv.className = `bnav-item ripple ${currentPage === it.id ? 'active' : ''}`;
      bDiv.innerHTML = `<div class="icon-wrap"><span class="material-symbols-outlined mat-icon">${it.icon}</span></div><span>${label}</span>`;
      bDiv.onclick = () => navigateTo(it.id);
      $('bottomNav').appendChild(bDiv);
    });

    // Sidebar Extra Items
    const aiDiv = document.createElement('div');
    aiDiv.className = `nav-item ripple ${currentPage === 'ai' ? 'active' : ''}`;
    aiDiv.innerHTML = `<span class="material-symbols-outlined mat-icon">auto_awesome</span>CMG AI`;
    aiDiv.onclick = () => navigateTo('ai');
    $('navItems').appendChild(aiDiv);

    const credDiv = document.createElement('div');
    credDiv.className = `nav-item ripple ${currentPage === 'credits' ? 'active' : ''}`;
    credDiv.innerHTML = `<span class="material-symbols-outlined mat-icon">info</span>Credits`;
    credDiv.onclick = () => navigateTo('credits');
    $('navItems').appendChild(credDiv);
  }

  function navigateTo(page) {
    currentPage = page; renderNav();
    const map = { dashboard: 'Dashboard', schedule: 'Schedule', broadcasts: 'Broadcasts', doubts: 'Doubts', assignments: 'Assignments', attendance: 'Attendance', profile: 'Profile', users: 'User Management', educators: 'Educators', batches: 'Batches', management: 'Management', ai: 'CMG AI', credits: 'Credits & About' };
    $('headerTitle').textContent = map[page] || page.charAt(0).toUpperCase() + page.slice(1);
    renderPage(page);
    if (window.innerWidth < 768) $('navDrawer').classList.remove('open');
  }

  function getBanner(title, sub) {
    return `<div class="page-title-banner"><h2>${title}</h2><p>${sub}</p></div>`;
  }

  // --- Page Router ---
  function renderPage(page) {
    if (!dataLoaded || !currentUser) return;
    const content = $('pageContent');
    switch (page) {
      case 'dashboard': renderDashboard(content); break;
      case 'schedule': renderSchedule(content); break;
      case 'broadcasts': renderBroadcasts(content); break;
      case 'doubts': renderDoubts(content); break;
      case 'assignments': renderAssignments(content); break;
      case 'attendance': renderAttendance(content); break;
      case 'profile': renderProfile(content); break;
      case 'users': renderUsers(content); break;
      case 'educators': renderEducators(content); break;
      case 'batches': renderBatches(content); break;
      case 'management': renderManagement(content); break;
      case 'ai': renderAI(content); break;
      case 'credits': renderCredits(content); break;
      default: content.innerHTML = getBanner('Coming Soon', 'This module is in development.');
    }
  }

  /* --- 1. DASHBOARD --- */
  function renderDashboard(el) {
    const user = currentUser;
    let html = getBanner(`Welcome back, ${user.name.split(' ')[0]}`, `${user.role.charAt(0).toUpperCase()+user.role.slice(1)} Dashboard`);
    
    const usersArr = toArray(allUsers);
    const batchesArr = toArray(allBatches);
    const schedulesArr = toArray(allSchedules);
    const broadcastsArr = toArray(allBroadcasts);
    const doubtsArr = toArray(allDoubts);
    const assignmentsArr = toArray(allAssignments);
    const attendanceArr = toArray(allAttendance);

    if (currentRole === 'student') {
      const batchName = user.batch ? (batchesArr.find(b => b.id === user.batch)?.name || 'Not assigned') : 'Not assigned';
      const today = new Date().toDateString();
      const todaySchedules = schedulesArr.filter(s => s.batch === user.batch && s.day === today);
      const pendingAssignments = assignmentsArr.filter(a => a.batch === user.batch && a.status !== 'submitted');
      const attendanceData = attendanceArr.filter(a => String(a.studentId) === String(user.id));
      const pct = attendanceData.length > 0 ? Math.round((attendanceData.filter(a => a.status === 'PRESENT').length / attendanceData.length) * 100) : 0;

      html += `
        <div class="md-grid-3" style="margin-bottom:16px;">
          <div class="md-card stat-card"><div class="num">${todaySchedules.length}</div><div class="label">Today's Classes</div></div>
          <div class="md-card stat-card"><div class="num">${pendingAssignments.length}</div><div class="label">Pending Assignments</div></div>
          <div class="md-card stat-card"><div class="num">${pct}%</div><div class="label">Attendance</div></div>
        </div>
        <div class="md-grid-2">
          <div class="md-card"><div class="card-title">📚 Your Batch</div><div class="card-sub" style="font-size:16px; margin-top:8px;">${batchName}</div></div>
          <div class="md-card"><div class="card-title">📢 Latest Broadcast</div><div class="card-sub" style="margin-top:8px;">${broadcastsArr.filter(b=>b.target==='all'||b.target===user.batch).slice(-1).map(b=>b.message).join('') || 'No broadcasts yet'}</div></div>
        </div>
      `;
    } else if (currentRole === 'educator') {
      const assigned = user.batches || [];
      const batchNames = assigned.map(id => batchesArr.find(b => b.id === id)?.name || id).join(', ') || 'None';
      const pendingDoubts = doubtsArr.filter(d => String(d.educatorId) === String(user.id) && d.status === 'OPEN');
      const activeAssignments = assignmentsArr.filter(a => String(a.educatorId) === String(user.id) && a.status !== 'submitted');
      html += `
        <div class="md-grid-3" style="margin-bottom:16px;">
          <div class="md-card stat-card"><div class="num">${assigned.length}</div><div class="label">Assigned Batches</div></div>
          <div class="md-card stat-card"><div class="num">${pendingDoubts.length}</div><div class="label">Pending Doubts</div></div>
          <div class="md-card stat-card"><div class="num">${activeAssignments.length}</div><div class="label">Active Assignments</div></div>
        </div>
        <div class="md-card"><div class="card-title">📚 Assigned Batches</div><div class="card-sub" style="margin-top:8px; font-size:15px;">${batchNames}</div></div>
      `;
    } else if (currentRole === 'admin') {
      const students = usersArr.filter(u => u.role === 'student');
      const educators = usersArr.filter(u => u.role === 'educator');
      const openDoubts = doubtsArr.filter(d => d.status === 'OPEN');
      const activeAssignments = assignmentsArr.filter(a => a.status !== 'submitted');
      html += `
        <div class="md-grid-3" style="margin-bottom:16px;">
          <div class="md-card stat-card"><div class="num">${students.length}</div><div class="label">Students</div></div>
          <div class="md-card stat-card"><div class="num">${educators.length}</div><div class="label">Educators</div></div>
          <div class="md-card stat-card"><div class="num">${batchesArr.length}</div><div class="label">Batches</div></div>
        </div>
        <div class="md-grid-3">
          <div class="md-card stat-card"><div class="num">${schedulesArr.length}</div><div class="label">Schedules</div></div>
          <div class="md-card stat-card"><div class="num">${broadcastsArr.length}</div><div class="label">Broadcasts</div></div>
          <div class="md-card stat-card"><div class="num">${openDoubts.length}</div><div class="label">Open Doubts</div></div>
        </div>
        <div class="md-card"><div class="card-title">📋 Active Assignments</div><div class="card-sub">${activeAssignments.length} pending submissions system-wide</div></div>
      `;
    }
    el.innerHTML = html;
  }

  /* --- 2. SCHEDULE --- */
  function renderSchedule(el) {
    let html = getBanner('Schedule', 'Your class schedule');
    const user = currentUser;
    const batchesArr = toArray(allBatches);
    const schedulesArr = toArray(allSchedules);
    let targetBatches = [];
    
    if (currentRole === 'student') targetBatches = user.batch ? [user.batch] : [];
    else if (currentRole === 'educator') targetBatches = user.batches || [];
    else if (currentRole === 'admin') targetBatches = batchesArr.map(b => b.id);

    const schedules = schedulesArr.filter(s => targetBatches.includes(s.batch));
    if (schedules.length === 0) {
      html += `<div class="empty-state"><span class="material-symbols-outlined mat-icon">calendar_month</span><h4>No schedules found</h4></div>`;
    } else {
      schedules.sort((a,b) => (a.day || '').localeCompare(b.day || ''));
      html += `<div class="md-grid">`;
      schedules.forEach(s => {
        const batch = batchesArr.find(b => b.id === s.batch);
        html += `<div class="md-card">
          <div class="card-title">${s.subject || 'Untitled'}</div>
          <div class="card-sub">${batch?.name || 'Unknown Batch'} · ${s.educatorName || 'Educator'}</div>
          <div class="card-meta" style="margin-top:16px;">
            <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;margin-right:4px;">event</span> ${s.day || 'TBD'}</span>
            <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;margin-right:4px;">schedule</span> ${s.startTime||'--'} - ${s.endTime||'--'}</span>
            ${s.room ? `<span class="chip"><span class="material-symbols-outlined" style="font-size:16px;margin-right:4px;">meeting_room</span> ${s.room}</span>` : ''}
          </div>
        </div>`;
      });
      html += `</div>`;
    }
    el.innerHTML = html;
  }

  /* --- 3. BROADCASTS --- */
  function renderBroadcasts(el) {
    let html = getBanner('Broadcasts', 'Announcements & Updates');
    if (currentRole === 'educator' || currentRole === 'admin') {
      html += `<button class="btn-primary ripple" style="width:auto; margin-bottom:24px;" onclick="window._newBroadcast()">+ New Broadcast</button>`;
      window._newBroadcast = () => openBroadcastDialog();
    }
    
    const broadcastsArr = toArray(allBroadcasts);
    let broadcasts = [];
    if (currentRole === 'student') broadcasts = broadcastsArr.filter(b => b.target === 'all' || b.target === currentUser.batch);
    else if (currentRole === 'educator') broadcasts = broadcastsArr.filter(b => String(b.educatorId) === String(currentUser.id));
    else broadcasts = broadcastsArr;
    
    if (broadcasts.length === 0) {
      html += `<div class="empty-state"><span class="material-symbols-outlined mat-icon">campaign</span><h4>No broadcasts</h4></div>`;
    } else {
      broadcasts.sort((a,b) => (b.createdAt || '').localeCompare(a.createdAt || '')); // Reverse sort logic

  /* --- 4. DOUBTS (FIXED DB RELATIONSHIPS) --- */
  function renderDoubts(el) {
    let html = getBanner('Doubts', 'Ask questions and clear your concepts');
    const doubtsArr = toArray(allDoubts);
    const usersArr = toArray(allUsers);

    if (currentRole === 'student') {
      html += `<button class="btn-primary ripple" style="width:auto; margin-bottom:24px;" onclick="window._newDoubt()">+ Ask a Question</button>`;
      const doubts = doubtsArr.filter(d => String(d.studentId) === String(currentUser.id));
      if (!doubts.length) html += `<div class="empty-state"><span class="material-symbols-outlined mat-icon">forum</span><h4>No doubts asked yet</h4></div>`;
      else doubts.reverse().forEach(d => html += doubtCard(d, true, usersArr));
    } else if (currentRole === 'educator') {
      const doubts = doubtsArr.filter(d => String(d.educatorId) === String(currentUser.id));
      if (!doubts.length) html += `<div class="empty-state"><span class="material-symbols-outlined mat-icon">forum</span><h4>No doubts assigned to you</h4></div>`;
      else doubts.reverse().forEach(d => html += doubtCard(d, false, usersArr));
    } else if (currentRole === 'admin') {
      if (!doubtsArr.length) html += `<div class="empty-state"><span class="material-symbols-outlined mat-icon">forum</span><h4>No doubts in system</h4></div>`;
      else doubtsArr.reverse().forEach(d => html += doubtCard(d, false, usersArr));
    }
    el.innerHTML = html;

    window._newDoubt = async () => {
      const educators = usersArr.filter(u => String(u.role).toLowerCase() === 'educator');
      const eduOpts = educators.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
      const dHtml = `
        <div class="md-field"><label>Select Educator</label><select id="dEdu">${eduOpts}</select></div>
        <div class="md-field"><label>Subject / Topic</label><input type="text" id="dTop" placeholder="e.g. Kinematics" /></div>
        <div class="md-field"><label>Your Question</label><textarea id="dQue" rows="4" placeholder="Describe your doubt in detail..."></textarea></div>
        <div class="md-field"><label>Images (optional)</label><input type="file" id="dImg" accept="image/*" multiple /></div>
      `;
      const v = await showDialog('Ask Doubt', '', dHtml, [{label:'Cancel', class:'outline'}, {label:'Submit', class:'primary', value:'submit'}]);
      if (v === 'submit') {
        const eid = $('dEdu').value;
        const sub = $('dTop').value.trim();
        const que = $('dQue').value.trim();
        const files = $('dImg').files;
        if(!eid || !que) return showSnack('Please fill all required fields');
        
        let images = [];
        if (files && files.length) {
          try { const uploads = await uploadMultiple(Array.from(files)); images = uploads.map(u => u.url); }
          catch (e) { return showSnack('Image upload failed'); }
        }
        await createRecord('doubts', { studentId: currentUser.id, educatorId: eid, subject: sub || 'General', question: que, images, status: 'OPEN', replies: [] });
        showSnack('Question submitted successfully');
      }
    };

    window._replyDoubt = async (id) => {
      const dHtml = `
        <div class="md-field"><label>Your Answer</label><textarea id="dRep" rows="4"></textarea></div>
        <div class="md-field"><label>Attach Images (optional)</label><input type="file" id="dRepImg" accept="image/*" multiple /></div>
      `;
      const v = await showDialog('Reply to Doubt', '', dHtml, [{label:'Cancel', class:'outline'}, {label:'Send Reply', class:'primary', value:'send'}]);
      if (v === 'send') {
        const text = $('dRep').value.trim();
        const files = $('dRepImg').files;
        if(!text) return showSnack('Please enter a reply');
        
        let images = [];
        if (files && files.length) {
          try { const uploads = await uploadMultiple(Array.from(files)); images = uploads.map(u => u.url); }
          catch (e) { return showSnack('Image upload failed'); }
        }
        
        const doubt = allDoubts[id];
        const reps = doubt.replies || [];
        reps.push({ authorId: currentUser.id, authorName: currentUser.name, text, images, createdAt: new Date().toISOString() });
        await updateRecord('doubts', id, { replies: reps, status: 'ANSWERED' });
        showSnack('Reply sent successfully!');
      }
    };
    
    window._resolveDoubt = async (id) => {
      await updateRecord('doubts', id, { status: 'RESOLVED' });
      showSnack('Doubt marked as resolved');
    };
  }

  function doubtCard(d, isStudent, usersArr) {
    const statusColor = d.status === 'OPEN' ? 'orange' : d.status === 'ANSWERED' ? 'blue' : 'green';
    const stu = usersArr.find(u => String(u.id) === String(d.studentId));
    const edu = usersArr.find(u => String(u.id) === String(d.educatorId));
    const reps = d.replies || [];
    
    let html = `
      <div class="md-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
          <strong style="font-family:'Google Sans',sans-serif; font-size:18px;">${d.subject || 'General'}</strong>
          <span class="chip ${statusColor}">${d.status}</span>
        </div>
        <p style="color:var(--md-sys-color-on-surface-variant); font-size:13px; margin-bottom:16px;">
          Asked by <strong>${stu?.name||'Unknown'}</strong> · Assigned to <strong>${edu?.name||'Unknown'}</strong>
        </p>
        <div style="background:var(--md-sys-color-surface); padding:16px; border-radius:12px; font-size:15px; border:1px solid var(--md-sys-color-outline-variant);">
          ${d.question}
          ${d.images && d.images.length ? `<div style="display:flex; gap:12px; margin-top:16px; flex-wrap:wrap;">${d.images.map(img => `<img src="${img}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--md-sys-color-outline-variant);" />`).join('')}</div>` : ''}
        </div>
    `;
    
    if (reps.length) {
      html += `<div style="margin-top:20px; border-left:4px solid var(--md-sys-color-primary-container); padding-left:16px;">`;
      reps.forEach(r => {
        html += `<div style="margin-bottom:16px;">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
            <div class="avatar-circle small" style="background:${avatarColor(r.authorName)}">${getAvatar(r.authorName)}</div>
            <strong style="font-size:14px;">${r.authorName}</strong>
          </div>
          <div style="font-size:15px; color:var(--md-sys-color-on-surface);">${r.text}</div>
          ${r.images && r.images.length ? `<div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">${r.images.map(img => `<img src="${img}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--md-sys-color-outline-variant);" />`).join('')}</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div style="margin-top:16px; font-size:14px; color:var(--md-sys-color-on-surface-variant); font-style:italic;">No replies yet.</div>`;
    }
    
    html += `<div class="card-actions">`;
    if (isStudent && d.status === 'ANSWERED') html += `<button class="btn-sm primary ripple" onclick="window._resolveDoubt('${d.id}')">Mark as Resolved</button>`;
    if (!isStudent && d.status === 'OPEN') html += `<button class="btn-sm primary ripple" onclick="window._replyDoubt('${d.id}')">Write Reply</button>`;
    html += `</div></div>`;
    return html;
  }

  async function openSubmitDialog(assignmentId) {
    const html = `
      <div class="md-field"><label>Your Answer / Solution</label><textarea id="subText" rows="5" placeholder="Type your response here..."></textarea></div>
      <div class="md-field"><label>Attach Images/Photos (optional)</label><input type="file" id="subImages" accept="image/*" multiple /></div>

      const text = $('subText').value.trim();
      const files = $('subImages').files;
      if (!text) return showSnack('Please enter your submission text');
      
      let images = [];
      if (files && files.length) {
        try { const uploads = await uploadMultiple(Array.from(files)); images = uploads.map(u => u.url); }

      }
      
      const submissionsArr = toArray(allSubmissions);
      const existing = submissionsArr.find(s => s.assignmentId === assignmentId && String(s.studentId) === String(currentUser.id));

      } else {
        await createRecord('submissions', { assignmentId, studentId: currentUser.id, studentName: currentUser.name, text, images, status: 'SUBMITTED' });

      showSnack('Assignment submitted successfully!');

              </div>
            </div>`;

          container.innerHTML = rows;

            </div>
          </div>`;
        });
        html2 += `</div>`;
      }
      await showDialog('Manage Timetables', '', html2, [{ label: 'Close', class: 'outline' }]);
      window._newSchedule = () => openScheduleDialog(null);
      window._editSchedule = (id) => openScheduleDialog(id);
      window._deleteSchedule = async (id) => {
        if (confirm('Delete this schedule?')) {
          try { await deleteRecord('schedules', id); showSnack('Schedule deleted'); closeDialog(); } 
          catch (e) { showSnack('Error deleting schedule'); }
        }
      };
    };
    
    window._clearNotifications = async () => {
      if(!confirm('Are you absolutely sure you want to clear all notifications system-wide?')) return;
      const notifs = toArray(allNotifications);
      for (const n of notifs) { await deleteRecord('notifications', n.id); }
      showSnack('All notifications cleared');
    };
  }

  async function openScheduleDialog(id) {
    const schedulesArr = toArray(allSchedules); const batchesArr = toArray(allBatches);
    const existing = id ? schedulesArr.find(s => s.id === id) : null;
    
    const batchOpts = batchesArr.map(b => `<option value="${b.id}" ${existing?.batch===b.id?'selected':''}>${b.name}</option>`).join('');
    if(batchesArr.length === 0) return showSnack('You must create a batch before creating a schedule.');
    
    const html = `
      <div class="md-field"><label>Batch</label><select id="schBatch">${batchOpts}</select></div>
      <div class="md-field"><label>Subject</label><input type="text" id="schSubject" value="${existing?.subject||''}" placeholder="e.g. Chemistry" /></div>
      <div class="md-field"><label>Educator Name</label><input type="text" id="schEducator" value="${existing?.educatorName||''}" placeholder="e.g. Mr. Sharma" /></div>
      <div class="md-field"><label>Day of Week</label><input type="text" id="schDay" value="${existing?.day||''}" placeholder="e.g. Monday" /></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="md-field"><label>Start Time</label><input type="text" id="schStart" value="${existing?.startTime||''}" placeholder="09:00 AM" /></div>
        <div class="md-field"><label>End Time</label><input type="text" id="schEnd" value="${existing?.endTime||''}" placeholder="10:30 AM" /></div>
      </div>
      <div class="md-field"><label>Room / Link (optional)</label><input type="text" id="schRoom" value="${existing?.room||''}" placeholder="e.g. Room 101 or Zoom Link" /></div>
    `;
    const val = await showDialog(id ? 'Edit Schedule' : 'Create Schedule', '', html, [{ label: 'Cancel', class: 'outline' }, { label: 'Save Schedule', class: 'primary', value: 'save' }]);
    
    if (val === 'save') {
      const data = { 
        batch:$('schBatch').value, subject:$('schSubject').value.trim(), 
        educatorName:$('schEducator').value.trim(), day:$('schDay').value.trim(), 
        startTime:$('schStart').value.trim(), endTime:$('schEnd').value.trim(), room:$('schRoom').value.trim() 
      };
      if (!data.batch || !data.subject || !data.day) return showSnack('Please fill required fields (Subject, Day)');
      try {
        if (existing) await updateRecord('schedules', id, data);
        else await createRecord('schedules', data);
        showSnack('Schedule saved successfully'); closeDialog();
      } catch (e) { showSnack('Error saving schedule'); }
    }
  }

  /* --- 12. AI & CREDITS --- */

      <div class="md-card" style="text-align:center; padding:80px 20px; position:relative; overflow:hidden;">

          <span class="material-symbols-outlined" style="font-size:64px; color:var(--md-sys-color-primary);">auto_awesome</span>

  }

          <div style="display:flex; justify-content:space-between; margin-bottom:16px;">

  // --- Auth Handlers ---
  $('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const en = $('loginEnroll').value.trim(), pass = $('loginPassword').value.trim();
    if (!en || !pass) return showSnack('Please fill all fields');
    
    $('loginBtn').textContent = 'Signing in...';
    $('loginBtn').disabled = true;
    
    try {
      const users = await get(ref(db, 'users')).then(s => s.val() || {});
      let valid = false;
      for (const [id, u] of Object.entries(users)) {
        if (u.enroll === en && u.password === pass) {
          if (u.disabled) { showSnack('Account disabled by Administrator'); break; }
          
          currentUser = {id, ...u}; currentRole = u.role.toLowerCase();
          
          // Switch UI BEFORE loading data to prevent errors
          $('login-page').classList.remove('active'); 
          $('app').classList.add('active');
          $('headerAvatar').textContent = getAvatar(u.name);
          $('headerAvatar').style.background = avatarColor(u.name);
          $('navUserName').textContent = u.name; 
          $('navUserEnroll').textContent = u.enroll;
          
          // Attach listeners securely now that currentUser exists
          loadAllData(); 
          
          navigateTo('dashboard'); 
          showSnack(`Welcome back, ${u.name.split(' ')[0]}!`);
          valid = true; break;
        }
      }
      if (!valid && !currentUser) showSnack('Invalid enrollment number or password');
    } catch (err) {
      showSnack('Login failed: Check connection');
    } finally {
      $('loginBtn').textContent = 'Sign In';
      $('loginBtn').disabled = false;
    }
  };

  $('signupForm').onsubmit = async (e) => {
    e.preventDefault();
    const name = $('signupName').value.trim();
    const enroll = $('signupEnroll').value.trim();
    const arn = $('signupArn').value.trim();
    const password = $('signupPassword').value.trim();
    const confirm = $('signupConfirm').value.trim();

    if (!name || !enroll || !arn || !password || !confirm) return showSnack('Please fill all fields');
    if (arn.length !== 4 || !/^\d{4}$/.test(arn)) return showSnack('ARN must be exactly 4 digits');
    if (password.length < 6) return showSnack('Password must be at least 6 characters');
    if (password !== confirm) return showSnack('Passwords do not match');

    $('signupBtn').textContent = 'Creating Account...';
    $('signupBtn').disabled = true;
    
    try {
      const users = await get(ref(db, 'users')).then(s => s.val() || {});
      for (const [id, u] of Object.entries(users)) {
        if (u.enroll === enroll) { throw new Error('Enrollment number already registered'); }
      }
      
      const userData = { name, enroll, arn, password, role: 'student', batch: null, disabled: false, batches: [], subjects: [], createdAt: new Date().toISOString() };
      const newRef = push(ref(db, 'users'));
      await set(newRef, userData);
      
      currentUser = { id: newRef.key, ...userData };
      currentRole = 'student';
      
      $('login-page').classList.remove('active'); $('app').classList.add('active');
      $('headerAvatar').textContent = getAvatar(name);
      $('headerAvatar').style.background = avatarColor(name);
      $('navUserName').textContent = name; $('navUserEnroll').textContent = enroll;
      
      loadAllData();
      navigateTo('dashboard');
      showSnack('Account created successfully!');
    } catch (err) {
      showSnack(err.message || 'Signup failed');
    } finally {
      $('signupBtn').textContent = 'Create Account';
      $('signupBtn').disabled = false;
    }
  };

  $('switchToSignup').onclick = () => { $('loginForm').style.display='none'; $('signupForm').style.display='block'; };
  $('switchToLogin').onclick = () => { $('loginForm').style.display='block'; $('signupForm').style.display='none'; };
  
  // FIXED: Both menu toggles control the slider now
  const toggleDrawer = () => $('navDrawer').classList.toggle('open');
  $('menuToggle').onclick = toggleDrawer;
  $('drawerMenuToggle').onclick = toggleDrawer;

  // --- Startup & Splash ---
  setTimeout(async () => {
    // Generate floating books background dynamically
    const bg = $('loginBg');
    const books = ['📚', '📖', '📕', '📗', '📘', '📙', '📓', '📔', '✏️', '📝'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('span');
      el.className = 'book'; el.textContent = books[i % books.length];
      el.style.left = Math.random() * 95 + '%'; el.style.top = Math.random() * 95 + '%';
      el.style.fontSize = (24 + Math.random() * 32) + 'px';
      el.style.animationDuration = (15 + Math.random() * 20) + 's';
      el.style.animationDelay = (Math.random() * 10) + 's';
      bg.appendChild(el);
    }

    // Auto-create Admin001 if database is completely empty
    if (firebaseConnected) {
      try {
        const users = await get(ref(db, 'users')).then(s => s.val());
        if (!users || Object.keys(users).length === 0) {
          await push(ref(db, 'users'), { name: 'Admin', enroll: 'ADMIN001', arn: '0000', password: 'admin123', role: 'admin', batch: null, disabled: false, batches: [], subjects: [], createdAt: new Date().toISOString() });
          console.log('📌 Default admin created: ADMIN001 / admin123');
        }
      } catch (e) { console.warn('Could not verify admin:', e.message); }
    }

    $('splash').classList.add('hide'); 
    $('login-page').classList.add('active');
    
    // We intentionally DO NOT call loadAllData() here anymore to prevent null crashes.
    // It gets called only AFTER a successful login.
    
    const banner = $('fbStatusBanner');
    if (!firebaseConnected) {
      banner.style.display = 'block';
      banner.textContent = '❌ Firebase connection failed. Please check internet or config.';
    }
  }, 1800);
</script>
